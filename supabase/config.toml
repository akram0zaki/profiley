# For more information on configuration, see:
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "profiley"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# OAuth providers — set tokens via env / dashboard, not in this file.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
redirect_uri = ""

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# `process-document` is invoked by pg_cron via pg_net with an X-Cron-Secret
# header (verified inside the function). It is never called from a browser, so
# we disable the platform-level JWT verification — otherwise the gateway
# returns 401 UNAUTHORIZED_NO_AUTH_HEADER before our handler runs.
[functions.process-document]
verify_jwt = false

# `get-public-profile` serves anonymous visitors viewing a shared profile
# link. The frontend cannot attach a user JWT for unauthenticated visitors,
# and the new `sb_publishable_*` API key format is rejected by the platform's
# JWT verifier with UNAUTHORIZED_INVALID_JWT_FORMAT. Disable verification at
# the gateway so the function (which already enforces public-visibility via
# the sanitized view) handles requests directly.
[functions.get-public-profile]
verify_jwt = false

# The remaining public profile interactions (chat, job-fit analysis, contact
# form, visit/event tracking) are also invoked by anonymous recruiter
# visitors. Same rationale as `get-public-profile` — the platform JWT check
# rejects publishable keys, so we disable it here and rely on per-function
# checks (Turnstile, profile preferences, rate limits).
[functions.chat-persona]
verify_jwt = false

[functions.analyze-job-fit]
verify_jwt = false

[functions.submit-recruiter-contact]
verify_jwt = false

[functions.track-recruiter-event]
verify_jwt = false

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Postgres extensions enabled at startup
[experimental]
orioledb_version = ""
